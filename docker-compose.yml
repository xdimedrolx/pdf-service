version: "3.9"

services:
  pdf-service:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: info
      BROWSER_POOL_SIZE: 2
      BROWSER_MAX_PAGES_PER_INSTANCE: 200
      NAVIGATION_TIMEOUT_MS: 180000
      RENDER_TIMEOUT_MS: 180000
    ports:
      - "4444:3000"
    restart: unless-stopped
